<!DOCTYPE html>
<html class="dark" lang="th">
<head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<script>
tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{sans:["Inter","Noto Sans Thai","sans-serif"]},colors:{
"surface":"#0f131c","surface-container":"#1c1f29","surface-container-high":"#262a34","surface-container-highest":"#313541","surface-container-low":"#181b25","surface-container-lowest":"#0a0e17","primary":"#4be277","on-primary":"#003915","on-surface":"#dfe2ef","on-surface-variant":"#bccbb9","outline-variant":"#3d4a3d","tertiary":"#50dfa4"}}}};
</script>

<style>
@keyframes pulse-neon{0%,100%{opacity:1;box-shadow:0 0 12px #4be277,0 0 20px rgba(75,226,119,.4)}50%{opacity:.4;box-shadow:0 0 4px #4be277}}

#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:9999999;max-width:90vw;display:none}
</style>
</head>
<body class="bg-surface font-sans text-on-surface flex flex-col min-h-screen">

<div id="toast" class="px-4 py-3 rounded-xl bg-surface-container-high border border-primary/40 text-sm shadow-2xl text-center" role="status" aria-live="polite"></div>

<header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl h-16 px-4 flex items-center justify-between border-b border-surface-container-high">
  <div class="flex items-center gap-2">
    <div class="w-2.5 h-2.5 rounded-full bg-primary neon-pulse"></div>
    <div class="flex flex-col">
      <div class="flex items-center gap-1.5">
        <span class="font-bold text-lg tracking-wider">AR PC BUILDER</span>
        <span class="text-[10px] text-primary uppercase px-1.5 py-0.5 rounded bg-surface-container-high font-semibold">AR//LAB</span>
      </div>
      <span class="text-xs text-on-surface-variant" data-t="sub"></span>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <button id="sfx-btn" onclick="toggleAudio()" aria-label="Sound" class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-primary active:scale-95 transition-all bg-surface-container-high">
      <span id="sfx-icon" class="material-symbols-outlined text-[20px]">volume_off</span>
    </button>
    <button onclick="toggleLanguage()" aria-label="Language" class="h-9 px-3 flex items-center justify-center gap-1 rounded-full bg-surface-container-high hover:text-primary active:scale-95 transition-all text-xs">
      <span id="lg-th" class="font-bold">TH</span><span class="text-outline-variant">/</span><span id="lg-en">EN</span>
    </button>
  </div>
</header>

<main class="flex-1 flex flex-col pt-20 pb-28 px-4 max-w-md mx-auto w-full">
  <section class="mb-6">
    <div class="rounded-2xl bg-surface-container-high/90 p-4 border border-surface-container-high">
      <div class="flex items-start justify-between mb-2">
        <div>
          <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-primary/15 text-primary text-xs font-semibold">
            <span class="material-symbols-outlined text-[14px]">flag</span><span data-t="quest"></span>
          </span>
          <h2 id="progress-text" class="text-xl font-bold mt-1"></h2>
        </div>
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-highest">
          <span class="material-symbols-outlined text-primary text-sm">bolt</span>

  <section class="mb-6">
    <button onclick="openQuizModal()" class="w-full text-left rounded-2xl bg-surface-container/95 p-4 border border-primary/40 active:scale-95 transition-all shadow-lg hover:border-primary">
      <span class="flex items-center justify-between">

          <span class="material-symbols-outlined text-primary text-2xl">quiz</span>
          <span>
            <span class="block font-bold text-sm" data-t="quizTitle"></span>

        <span class="px-3 py-1 rounded-full bg-primary/20 text-primary text-xs font-bold" data-t="quizBtn"></span>

  <div class="flex items-center justify-between mb-3">

<div class="fixed bottom-6 inset-x-0 z-40 px-4 flex justify-center max-w-md mx-auto pointer-events-none">
  <button onclick="startARScan()" class="pointer-events-auto w-full h-14 rounded-full bg-primary text-on-primary font-bold text-base flex items-center justify-center gap-2 shadow-[0_0_25px_rgba(75,226,119,0.5)] active:scale-95 transition-all">

<div id="quiz-modal" style="display:none" class="fixed inset-0 z-[9999999] items-center justify-center bg-black/80 backdrop-blur-md px-4" role="dialog" aria-modal="true">

<script>
/* ---------- Storage (safe) ---------- */
const store={
  get(k,d){try{const v=parseInt(localStorage.getItem(k));return isNaN(v)?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

/* ---------- i18n ---------- */
const T={
TH:{sub:'สื่อการเรียนรู้ประกอบคอมฯ',quest:'เควสต์สะสมชิ้นส่วน',progress:'ปลดล็อกแล้ว {n} / 10 ชิ้น',hint:'สแกนชิ้นส่วนและทำแบบทดสอบเพื่อปลดล็อก',
quizTitle:'ทำแบบทดสอบเพื่อรับ XP',quizSub:'คลิกเพื่อเปิดข้อสอบการ์ดจอ (GPU)',quizBtn:'เริ่มทำข้อสอบ',inv:'คลังชิ้นส่วนฮาร์ดแวร์',count:'10 รายการ',
locked:'ล็อกอยู่',unlocked:'ปลดล็อกแล้ว',scan:'สแกน AR ดูโมเดล',again:'ดูโมเดล 3D อีกครั้ง',scanAll:'สแกนชิ้นส่วน AR เต็มจอ',
modalTitle:'แบบทดสอบการ์ดจอ (GPU)',pick:'เลือกคำตอบที่ถูกต้องที่สุด',reward:'รางวัล: {n} XP',
q:'หน้าที่หลักของ GPU ในคอมพิวเตอร์คือข้อใด?',
o:['ประมวลผลกราฟิกและภาพ 3D','จัดเก็บไฟล์ระบบถาวร (Storage)','จ่ายกระแสไฟฟ้าให้เมนบอร์ด','ประมวลผลคำสั่งหลักของระบบ (CPU)'],
back:'ย้อนกลับ',arQuiz:'ทำแบบทดสอบ ({n} XP)',reset:'รีเซ็ต',cardTitle:'การ์ดจอ (GPU - RTX 4090)',
cardDesc:'ทำหน้าที่ประมวลผลภาพกราฟิก 3D และเรนเดอร์ภาพออกจอคอมพิวเตอร์ มีพัดลมระบายความร้อนประสิทธิภาพสูง',
found:'🎉 สแกนเจอโมเดล 3D สำเร็จ!',gesture:'💡 ใช้นิ้วลากเพื่อหมุน | ถ่างเพื่อซูม',
ok:'🎉 ตอบถูกต้อง! ปลดล็อกการ์ดจอสำเร็จ ได้รับ {n} XP',wrong:'❌ ยังไม่ถูกต้อง! หัก 20 XP เหลือรางวัลรอบนี้ {n} XP',
done:'คุณปลดล็อกการ์ดจอแล้ว ทำซ้ำไม่ได้ XP เพิ่ม',https:'ต้องเปิดผ่าน HTTPS จึงจะใช้กล้องได้',
camErr:'เปิดกล้องไม่สำเร็จ ตรวจสอบสิทธิ์กล้องของเบราว์เซอร์',noData:'ไม่พบไฟล์โมเดล (js/gpu.js)'},
EN:{sub:'PC assembly learning kit',quest:'Parts collection quest',progress:'Unlocked {n} / 10 parts',hint:'Scan parts and take quizzes to unlock them',
quizTitle:'Take a quiz to earn XP',quizSub:'Tap to open the graphics card (GPU) quiz',quizBtn:'Start quiz',inv:'Hardware inventory',count:'10 items',
locked:'Locked',unlocked:'Unlocked',scan:'Scan AR model',again:'View 3D model again',scanAll:'Scan parts in full-screen AR',
modalTitle:'Graphics card (GPU) quiz',pick:'Choose the best answer',reward:'Reward: {n} XP',
q:'What is the main job of a GPU in a computer?',
o:['Process graphics and 3D images','Store system files permanently','Supply power to the motherboard','Run the main system instructions (CPU)'],
back:'Back',arQuiz:'Take quiz ({n} XP)',reset:'Reset',cardTitle:'Graphics card (GPU - RTX 4090)',
cardDesc:'Processes 3D graphics and renders images to the monitor. Equipped with a high-performance cooling fan.',
found:'🎉 3D model found!',gesture:'💡 Drag to rotate | Pinch to zoom',
ok:'🎉 Correct! GPU unlocked. You earned {n} XP',wrong:'❌ Not quite! -20 XP, reward is now {n} XP. Try another answer',
done:'You already unlocked the GPU. No extra XP for repeats',https:'Camera needs HTTPS to work',
camErr:'Could not open the camera. Check browser camera permission',noData:'Model file not found (js/gpu.js)'}
};
const PARTS=[['videogame_asset','การ์ดจอ (GPU)','Graphics card (GPU)'],['developer_board','ซีพียู (CPU)','Processor (CPU)'],['grid_goldenratio','เมนบอร์ด','Motherboard'],['memory','แรม (RAM)','Memory (RAM)'],['save','เอสเอสดี (SSD)','Storage (SSD)'],['power','พาวเวอร์ซัพพลาย','Power supply'],['mode_fan','ชุดน้ำระบายความร้อน','Liquid cooler'],['computer','เคสคอมพิวเตอร์','PC case'],['cable','สายไฟ & พัดลม','Cables & fans'],['tv','จอภาพ (Monitor)','Monitor']];

let lang=(()=>{try{return localStorage.getItem('ar_lang')==='EN'?'EN':'TH'}catch(e){return'TH'}})();
const t=(k,n)=>(T[lang][k]||'').replace('{n}',n);
const $=id=>document.getElementById(id);

/* ---------- State ---------- */
let currentXP=store.get('ar_xp',0);
let unlockedCount=store.get('ar_unlocked',0);
let reward=store.get('ar_reward',100);
const isUnlocked=()=>unlockedCount>0;

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3200)}

/* ---------- Render ---------- */
function render(){
  document.documentElement.lang=lang.toLowerCase();
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('lg-th').className=lang==='TH'?'font-bold text-primary':'text-on-surface-variant';
  $('lg-en').className=lang==='EN'?'font-bold text-primary':'text-on-surface-variant';
  $('progress-text').textContent=t('progress',unlockedCount);
  $('xp-text').textContent=currentXP+' XP';
  $('reward-pill').textContent=t('reward',reward);
  $('ar-quiz-label').textContent=t('arQuiz',reward);
  $('progress-bar').innerHTML=Array.from({length:10},(_,i)=>i<unlockedCount?'<div class="rounded bg-primary shadow-[0_0_8px_#4be277]"></div>':'<div class="rounded bg-surface-container-highest"></div>').join('');
  const i=lang==='TH'?1:2,u=isUnlocked();
  $('inventory-grid').innerHTML=PARTS.map((p,n)=>{
    const num=String(n+1).padStart(2,'0');
    if(n>0)return `<div class="flex flex-col justify-between rounded-xl bg-surface-container-low p-3 opacity-50"><span class="text-xs text-on-surface-variant mb-2">${num} • ${p[i]}</span><div class="w-full h-16 rounded bg-surface-container-lowest flex items-center justify-center"><span class="material-symbols-outlined">${p[0]}</span></div></div>`;
    return `<div class="flex flex-col justify-between rounded-xl p-3 ${u?'bg-surface-container-high border border-primary/50 shadow-[0_0_15px_rgba(75,226,119,0.15)]':'bg-surface-container-low opacity-60'}">
      <div class="flex items-center justify-between mb-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u?'bg-primary/20 text-primary':'bg-surface-container-highest text-on-surface-variant'}">${t(u?'unlocked':'locked')}</span>${u?'<span class="material-symbols-outlined text-primary text-sm">verified</span>':`<span class="text-xs text-on-surface-variant">${num}</span>`}</div>
      <div class="w-full h-20 rounded-lg bg-surface-container-lowest flex items-center justify-center mb-2"><span class="material-symbols-outlined text-3xl ${u?'text-primary':'text-on-surface-variant'}">${p[0]}</span></div>
      <h4 class="font-bold text-sm">${p[i]}</h4><p class="text-xs text-on-surface-variant mb-2">RTX 4090</p>
      <button onclick="startARScan()" class="w-full py-1.5 rounded-lg text-xs flex items-center justify-center gap-1 active:scale-95 transition-all ${u?'bg-primary text-on-primary font-bold':'bg-surface-container-high text-primary'}"><span class="material-symbols-outlined text-sm">${u?'view_in_ar':'qr_code_scanner'}</span>${t(u?'again':'scan')}</button></div>`;
  }).join('');
  if($('quiz-modal').style.display==='flex')renderQuiz();
}
function toggleLanguage(){lang=lang==='TH'?'EN':'TH';try{localStorage.setItem('ar_lang',lang)}catch(e){}render()}

/* ---------- Quiz ---------- */
let order=[0,1,2,3];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuiz(){
  $('quiz-q').textContent=t('q');
  $('quiz-opts').innerHTML=order.map((o,i)=>`<button data-o="${o}" class="w-full text-left p-3 rounded-xl bg-surface-container-low text-xs text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all border border-transparent">${'ABCD'[i]}. ${T[lang].o[o]}</button>`).join('');
  $('quiz-opts').querySelectorAll('button').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.o==='0'));
}
function openQuizModal(){
  if(isUnlocked()){toast(t('done'))}
  order=shuffle([0,1,2,3]);renderQuiz();
  $('quiz-modal').style.display='flex';
}
function closeQuizModal(){$('quiz-modal').style.display='none'}
function answerQuiz(ok){
  if(isUnlocked()){closeQuizModal();return}
  if(ok){
    const earned=reward;
    currentXP+=earned;unlockedCount=1;reward=100;
    store.set('ar_xp',currentXP);store.set('ar_unlocked',unlockedCount);store.set('ar_reward',reward);
    closeQuizModal();stopARScan();render();toast(t('ok',earned));
  }else{
    reward=Math.max(20,reward-20);store.set('ar_reward',reward);
    render();toast(t('wrong',reward));
  }
}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuizModal()});

/* ---------- Audio ---------- */
let audioCtx=null,bgmGain=null,playing=false,bgmTimer=null;
function toggleAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  playing=!playing;
  $('sfx-icon').textContent=playing?'volume_up':'volume_off';
  playing?playBGM():stopBGM();
}
function playBGM(){
  if(bgmGain)return;
  bgmGain=audioCtx.createGain();bgmGain.gain.value=0.05;bgmGain.connect(audioCtx.destination);
  const notes=[220,246.94,277.18,329.63,369.99];let i=0;
  bgmTimer=setInterval(()=>{
    if(!playing||!bgmGain)return;
    try{
      const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=notes[i];
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(1,now+0.1);g.gain.linearRampToValueAtTime(0,now+1.2);
      o.connect(g);g.connect(bgmGain);o.start(now);o.stop(now+1.25);
      i=(i+1)%notes.length;
    }catch(e){}
  },1500);
}
function stopBGM(){clearInterval(bgmTimer);bgmTimer=null;if(bgmGain){bgmGain.disconnect();bgmGain=null}}
document.addEventListener('visibilitychange',()=>{if(playing&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume()});

/* ---------- AR ---------- */
const arView=$('ar-view'),container=$('ar-container'),freeze=$('camera-freeze-container'),infoCard=$('ar-info-card');
let activeModel=null,userScale=1,arRunning=false;
let dragging=false,prev={x:0,y:0},pinch=null;
const mindSys=()=>{const s=$('ar-scene-el');return s&&s.systems&&s.systems['mindar-image-system']};

async function startARScan(){
  if(!window.isSecureContext){toast(t('https'));return}
  if(window.gpuLoadFailed||typeof gpuData==='undefined'){toast(t('noData'));return}
  arView.style.display='block';
  if(!container.children.length)loadTarget(gpuData);
  try{
    const sys=mindSys();
    if(!sys)throw new Error('MindAR not ready');
    if(!arRunning){arRunning=true;await sys.start()}
  }catch(e){
    console.error(e);arRunning=false;
    arView.style.display='none';toast(t('camErr'));
  }
}
function stopARScan(){
  arView.style.display='none';
  clearModel();container.innerHTML='';
  try{const s=mindSys();if(s&&arRunning)s.stop()}catch(e){}
  arRunning=false;
  if(playing&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function clearModel(){
  if(activeModel){activeModel.remove();activeModel=null}
  userScale=1;dragging=false;pinch=null;infoCard.style.display='none';
}
function loadTarget(d){
  const target=document.createElement('a-entity');
  target.setAttribute('mindar-image-target','targetIndex: '+d.targetIndex);
  target.addEventListener('targetFound',()=>{
    if(activeModel)return;
    // Create a fresh model under the camera (never re-parent a loaded entity)
    activeModel=document.createElement('a-entity');
    const m=document.createElement('a-entity');
    m.setAttribute('gltf-model',d.model);
    m.setAttribute('scale','0.05 0.05 0.05');
    activeModel.appendChild(m);
    freeze.appendChild(activeModel);
    infoCard.style.display='block';
  });
  container.appendChild(target);
}
function resetARModel(){
  clearModel();container.innerHTML='';
  if(typeof gpuData!=='undefined')loadTarget(gpuData);
}

/* Touch gestures: only on the AR view, never on buttons/cards */
const ignoreTouch=e=>!!e.target.closest('button,#ar-info-card');
const dist=ts=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
arView.addEventListener('touchstart',e=>{
  if(!activeModel||ignoreTouch(e))return;
  if(e.touches.length===1){dragging=true;prev={x:e.touches[0].clientX,y:e.touches[0].clientY}}
  else if(e.touches.length===2){dragging=false;pinch=dist(e.touches)}
},{passive:true});
arView.addEventListener('touchmove',e=>{
  if(!activeModel||ignoreTouch(e))return;
  e.preventDefault();
  if(dragging&&e.touches.length===1){
    const x=e.touches[0].clientX,y=e.touches[0].clientY,r=activeModel.getAttribute('rotation');
    activeModel.setAttribute('rotation',{x:r.x+(y-prev.y)*0.4,y:r.y+(x-prev.x)*0.4,z:r.z});
    prev={x,y};
  }else if(e.touches.length===2&&pinch){
    const d=dist(e.touches);
    userScale=Math.min(Math.max(userScale*(d/pinch),0.1),10);
    activeModel.setAttribute('scale',{x:userScale,y:userScale,z:userScale});
    pinch=d;
  }
},{passive:false});
arView.addEventListener('touchend',e=>{dragging=false;pinch=null;if(e.touches.length===1){dragging=true;prev={x:e.touches[0].clientX,y:e.touches[0].clientY}}});

render();
</script>
