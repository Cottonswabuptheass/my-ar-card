<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ดึง A-Frame และ MindAR Library มาใช้งาน -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #play-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        z-index: 999;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <button id="play-button">แตะเพื่อเล่นวิดีโอพร้อมเสียง</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- ไฟล์วิดีโออธิบายฮาร์ดแวร์ -->
        <video id="hardware-video" src="./hardware-intro.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline></video>
      <video id="ram-video" src="./024-Ram ฮาร์ดแวร์ที่ต้องรู้จัก.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

     <a-entity mindar-image-target="targetIndex: 0" id="target">
  <a-video src="#hardware-video" width="1.78" height="1" position="0 0 0" rotation="0 0 0"></a-video>
</a-entity>

<a-entity mindar-image-target="targetIndex: 1" id="target2">
  <a-video src="#ram-video" width="1.78" height="1" position="0 0 0" rotation="0 0 0"></a-video>
</a-entity>

    </a-scene>

    <script>
  const playButton = document.querySelector('#play-button');
  const video1 = document.querySelector('#hardware-video');
  const video2 = document.querySelector('#ram-video');

  const target1 = document.querySelector('#target');
  const target2 = document.querySelector('#target2');

  // กดปุ่มแล้วเริ่มสั่งให้เตรียมพร้อมเล่นวิดีโอ (ปลดล็อกระบบเสียง)
  playButton.addEventListener('click', () => {
    video1.play(); video1.pause();
    video2.play(); video2.pause();
    playButton.style.display = 'none';
  });

  // รูปที่ 1 (การ์ดจอ)
  target1.addEventListener("targetFound", () => video1.play());
  target1.addEventListener("targetLost", () => video1.pause());

  // รูปที่ 2 (RAM)
  target2.addEventListener("targetFound", () => video2.play());
  target2.addEventListener("targetLost", () => video2.pause());
</script>
  </body>
</html>
