<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR - 3D Hardware Guide</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector@v1.0.1/dist/aframe-gesture-detector.min.js"></script>

  <!-- ดึงไฟล์ข้อมูล GPU -->
  <script src="./js/gpu.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; }
    
    /* การ์ดข้อมูลด้านล่างจอ */
    #info-card {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 400px; background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #ffffff; padding: 16px 20px; border-radius: 16px; z-index: 1000;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    #info-card h4 { margin: 0 0 6px 0; color: #38bdf8; font-size: 18px; }
    #info-card p { margin: 0; font-size: 13px; color: #e2e8f0; line-height: 1.5; }
    
    /* คำแนะนำการหมุน/ซูม */
    .hint { font-size: 11px; color: #94a3b8; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
  </style>
</head>
<body>

  <!-- กล่องข้อมูลคงที่ด้านล่าง -->
  <div id="info-card">
    <h4 id="card-title">กำลังโหลด...</h4>
    <p id="card-desc">ส่องกล้องไปที่รูปภาพเพื่อดูโมเดล 3D</p>
    <div class="hint">💡 ใช้นิ้วลากเพื่อหมุน | ใช้นิ้วถ่างเพื่อซูมเข้า-ออก</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    gesture-detector>
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- พื้นที่สร้าง AR -->
    <a-entity id="ar-container"></a-entity>
  </a-scene>

  <script>
    const container = document.getElementById('ar-container');

    function loadARItem(itemData) {
      if (!itemData) return;

      // แสดงข้อมูลการ์ดทันที
      document.getElementById('card-title').innerText = itemData.title || 'ข้อมูลอุปกรณ์';
      document.getElementById('card-desc').innerText = itemData.desc || '';

      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${itemData.targetIndex}`);

      // ตัวโมเดล 3D รองรับการลากหมุน และ ถ่างนิ้วซูม
      const modelEntity = document.createElement('a-entity');
      modelEntity.setAttribute('gltf-model', itemData.model);
      modelEntity.setAttribute('scale', itemData.scale || '0.08 0.08 0.08');
      modelEntity.setAttribute('position', itemData.position || '0 0 0');
      modelEntity.setAttribute('rotation', itemData.rotation || '0 0 0');
      modelEntity.setAttribute('class', 'clickable');
      
      // สคริปต์ควบคุมการหมุนและซูมด้วยนิ้ว
      modelEntity.setAttribute('gesture-handler', 'minScale: 0.01; maxScale: 1.0;');

      targetEntity.appendChild(modelEntity);
      container.appendChild(targetEntity);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof gpuData !== 'undefined') {
        loadARItem(gpuData);
      }
    });
  </script>
</body>
</html>
