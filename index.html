<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Graphics Card Guide (Improved)</title>
  <!-- โหลด A-Frame เวอร์ชั่นล่าสุดและ MindAR สำหรับ A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <!-- โหลดสคริปต์สำหรับจัดการการหมุน/ซูมด้วยนิ้ว -->
  <script src="https://raw.githack.com/fcor/aframe-gesture-detector/master/dist/aframe-gesture-detector.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <!-- พื้นหลังดำป้องกันแสงแยงตา -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 2; uiLoading: no; filter: strong;" 
    gesture-detector
    color-space="sRGB" 
    renderer="colorManagement: true; precision: high; alpha: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-ambient-light color="#bbb" intensity="1.5"></a-ambient-light>
    <a-directional-light position="1 2 3" intensity="1.2"></a-directional-light>

    <!-- กล้องที่มาพร้อมกับ look-controls สำหรับ gesture และมี embedded เพื่อให้เห็นกล้องด้านหลัง -->
    <a-camera position="0 0 0" look-controls="enabled: true" embedded></a-camera>

    <!-- คอนเทนเนอร์หลักสำหรับเก็บ Target และ Model -->
    <a-entity id="ar-container">
      <a-entity id="card-target" mindar-image-target="targetIndex: 0" visible="false">
        <!-- โมเดลที่เพิ่มคอมโพเนนต์สำหรับหมุนและซูม -->
        <a-entity id="gpu-model"
                  gltf-model="./gpu.glb"
                  scale="0.2 0.2 0.2"
                  class="gesture-target"
                  gesture-handler="minScale: 0.1; maxScale: 1.0; rotationMultiplier: 2;"
                  visible="true"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const targetEntity = document.getElementById('card-target');
      let isFound = false;

      // เมื่อสแกนเจอ: หยุดระบบติดตามภาพ และล็อกโมเดลไว้ให้ลอยค้างหน้าจอ
      targetEntity.addEventListener("targetFound", (event) => {
        if (!isFound) {
          isFound = true;
          // แสดงโมเดลและหยุดติดตามเป้าหมายทันที
          sceneEl.setAttribute('mindar-image', 'autoStart', 'false');
          targetEntity.setAttribute('visible', 'true');
          console.log("เป้าหมายถูกล็อก! โมเดลจะไม่หายแม้คุณจะแพนกล้องหนี");
        }
      });
    });
  </script>
</body>
</html>
