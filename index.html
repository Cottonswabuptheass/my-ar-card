<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ดึง A-Frame และ MindAR Library มาใช้งาน -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #play-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        z-index: 999;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <button id="play-button">แตะเพื่อเล่นวิดีโอพร้อมเสียง</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- ไฟล์วิดีโออธิบายฮาร์ดแวร์ -->
        <video id="hardware-video" src="./hardware-intro.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline></video>
      <video id="ram-video" src="./024-Ram ฮาร์ดแวร์ที่ต้องรู้จัก.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-video src="#hardware-video" width="1.78" height="1" position="0 0 0" rotation="0 0 0"></a-video>
      <a-entity mindar-image-target="targetIndex: 1">
  <a-video src="#ram-video" width="1.78" height="1" position="0 0 0" rotation="0 0 0"></a-video>
</a-entity>
      </a-entity>

    </a-scene>

    <script>
      const video = document.querySelector('#hardware-video');
      const playButton = document.querySelector('#play-button');
      const target = document.querySelector('#target');

      playButton.addEventListener('click', () => {
        video.play();
        playButton.style.display = 'none';
      });

      target.addEventListener("targetFound", event => {
        video.play();
      });

      target.addEventListener("targetLost", event => {
        video.pause();
      });
    </script>
  </body>
</html>
