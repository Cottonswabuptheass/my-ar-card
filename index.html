<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR - 3D Hardware Guide</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- ดึงไฟล์ข้อมูล GPU -->
  <script src="./js/gpu.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; background-color: #000; }
    
    /* การ์ดข้อมูลด้านล่าง (ซ่อนไว้ก่อนสแกน) */
    #info-card {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 400px; background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #ffffff; padding: 16px 20px; border-radius: 16px; z-index: 1000;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: none; /* ซ่อนไว้ก่อน */
      animation: fadeInUp 0.4s ease-out;
    }
    #info-card h4 { margin: 0 0 6px 0; color: #38bdf8; font-size: 18px; }
    #info-card p { margin: 0; font-size: 13px; color: #e2e8f0; line-height: 1.5; }
    .hint { font-size: 11px; color: #94a3b8; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

    /* ตัวช่วยบอกสแกน */
    #scan-guide {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7); color: #fff; padding: 8px 16px;
      border-radius: 20px; font-size: 13px; border: 1px solid rgba(255,255,255,0.2);
      z-index: 1000; pointer-events: none;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <div id="scan-guide">🔍 ส่องกล้องไปที่รูปภาพเป้าหมาย</div>

  <!-- กล่องข้อมูลที่จะเด้งขึ้นมาหลังสแกนติด -->
  <div id="info-card">
    <h4 id="card-title">กำลังโหลด...</h4>
    <p id="card-desc">...</p>
    <div class="hint">💡 ใช้นิ้วลากหมุนดูโมเดลได้ 360 องศา</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;" 
    color-space="sRGB" 
    renderer="colorManagement: true; precision: medium; powerPreference: high-performance;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-ambient-light color="#ffffff" intensity="1.5"></a-ambient-light>

    <!-- กล้องล็อกมุมมองเพื่อหมุนโมเดลลื่นๆ -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="ar-container"></a-entity>
  </a-scene>

  <script>
    const container = document.getElementById('ar-container');
    let isTracked = false;

    // ระบบตรวจจับการลากนิ้วบนหน้าจอเพื่อหมุนโมเดล
    let isDragging = false;
    let previousTouchPosition = { x: 0, y: 0 };
    let modelEntityRef = null;

    function loadARItem(itemData) {
      if (!itemData) return;

      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${itemData.targetIndex}`);

      const modelEntity = document.createElement('a-entity');
      modelEntity.setAttribute('gltf-model', itemData.model);
      modelEntity.setAttribute('scale', itemData.scale || '0.08 0.08 0.08');
      modelEntity.setAttribute('position', itemData.position || '0 0 0');
      modelEntity.setAttribute('rotation', itemData.rotation || '0 0 0');
      
      modelEntityRef = modelEntity;
      targetEntity.appendChild(modelEntity);

      // เมื่อสแกนเจอภาพครั้งแรก
      targetEntity.addEventListener("targetFound", () => {
        if (!isTracked) {
          isTracked = true;
          
          // 1. แสดงการ์ดข้อมูล
          document.getElementById('card-title').innerText = itemData.title || 'ข้อมูลอุปกรณ์';
          document.getElementById('card-desc').innerText = itemData.desc || '';
          document.getElementById('info-card').style.display = 'block';
          document.getElementById('scan-guide').style.display = 'none';
        }
      });

      container.appendChild(targetEntity);
    }

    // ระบบ Touch Controls ลากหมุนลื่นๆ 360 องศา
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || !modelEntityRef || e.touches.length !== 1) return;

      const deltaX = e.touches[0].clientX - previousTouchPosition.x;
      const deltaY = e.touches[0].clientY - previousTouchPosition.y;

      const currentRotation = modelEntityRef.getAttribute('rotation');
      modelEntityRef.setAttribute('rotation', {
        x: currentRotation.x + deltaY * 0.4,
        y: currentRotation.y + deltaX * 0.4,
        z: currentRotation.z
      });

      previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    window.addEventListener('touchend', () => { isDragging = false; });

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof gpuData !== 'undefined') {
        loadARItem(gpuData);
      }
    });
  </script>
</body>
</html>
