<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR - 3D Hardware Guide</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector@v1.0.1/dist/aframe-gesture-detector.min.js"></script>

  <!-- ดึงไฟล์ข้อมูล GPU -->
  <script src="./js/gpu.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; }
    #info-card {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      width: 85%; max-width: 380px; background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.4);
      color: #ffffff; padding: 16px 20px; border-radius: 16px; display: none; z-index: 1000;
    }
    #info-card h4 { margin: 0 0 6px 0; color: #38bdf8; font-size: 18px; }
    #info-card p { margin: 0; font-size: 14px; color: #e2e8f0; line-height: 1.5; }
    .close-btn { position: absolute; top: 10px; right: 14px; cursor: pointer; color: #94a3b8; font-size: 18px; }
  </style>
</head>
<body>

  <div id="info-card">
    <span class="close-btn" onclick="closeCard()">✕</span>
    <h4 id="card-title">หัวข้อ</h4>
    <p id="card-desc">รายละเอียด...</p>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    gesture-detector>
    
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

    <!-- พื้นที่สร้าง AR -->
    <a-entity id="ar-container"></a-entity>
  </a-scene>

  <script>
    // สคริปต์ดึงข้อมูลจาก JS มาแสดงผล
    const container = document.getElementById('ar-container');

    function loadARItem(itemData) {
      if (!itemData) return;

      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${itemData.targetIndex}`);

      const modelEntity = document.createElement('a-entity');
      modelEntity.setAttribute('gltf-model', itemData.model);
      modelEntity.setAttribute('scale', itemData.scale || '0.5 0.5 0.5');
      modelEntity.setAttribute('position', '0 0 0');
      modelEntity.setAttribute('class', 'clickable');
      modelEntity.setAttribute('gesture-handler', '');

      targetEntity.appendChild(modelEntity);

      // สร้างจุด Hotspot สีขาว
      if (itemData.hotspots) {
        itemData.hotspots.forEach(spot => {
          const point = document.createElement('a-sphere');
          point.setAttribute('position', spot.pos);
          point.setAttribute('radius', '0.04');
          point.setAttribute('color', '#38bdf8');
          point.setAttribute('class', 'clickable');
          point.setAttribute('animation', 'property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 800');

          point.addEventListener('click', () => {
            document.getElementById('card-title').innerText = spot.title;
            document.getElementById('card-desc').innerText = spot.desc;
            document.getElementById('info-card').style.display = 'block';
          });

          targetEntity.appendChild(point);
        });
      }

      container.appendChild(targetEntity);
    }

    function closeCard() {
      document.getElementById('info-card').style.display = 'none';
    }

    // เรียกใช้งานข้อมูล GPU
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof gpuData !== 'undefined') {
        loadARItem(gpuData);
      }
    });
  </script>
</body>
</html>
