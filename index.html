<!DOCTYPE html>
<html lang="th">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR - 3D Hardware Guide</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector@v1.0.1/dist/aframe-gesture-detector.min.js"></script>

    <!-- เรียกดึงไฟล์ข้อมูลของแต่ละชิ้นเข้ามาตรงนี้ -->
    <script src="./data/gpu.js"></script>
    <!-- <script src="./data/cpu.js"></script> -->

    <style>
      body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; }
      #info-card {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        width: 85%; max-width: 380px; background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.4);
        color: #ffffff; padding: 16px 20px; border-radius: 16px; display: none; z-index: 1000;
      }
      #info-card h4 { margin: 0 0 6px 0; color: #38bdf8; font-size: 18px; }
      #info-card p { margin: 0; font-size: 14px; color: #e2e8f0; line-height: 1.5; }
      .close-btn { position: absolute; top: 10px; right: 14px; cursor: pointer; color: #94a3b8; font-size: 18px; }
    </style>
  </head>
  <body>

    <div id="info-card">
      <span class="close-btn" onclick="closeCard()">✕</span>
      <h4 id="card-title">หัวข้อ</h4>
      <p id="card-desc">รายละเอียด...</p>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      gesture-detector>

      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

      <!-- พื้นที่สร้าง AR ถ่ายโอนข้อมูลจาก JS ออกมาอัตโนมัติ -->
      <a-entity id="ar-container"></a-entity>
    </a-scene>

    <script>
      // ระบบดึงข้อมูลจากไฟล์ JS มาสร้างโมเดลและจุดขาวอัตโนมัติ
      window.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('ar-container');
        
        // รวบรวมข้อมูลทุกชิ้นงาน (ถ้านำเข้าไฟล์ JS ชิ้นใหม่ ให้เอาชื่อมาต่อตรงนี้)
        const items = [typeof gpuData !== 'undefined' ? gpuData : null].filter(Boolean);

        items.forEach((item) => {
          const entity = document.createElement('a-entity');
          entity.setAttribute('mindar-image-target', `targetIndex: ${item.targetIndex}`);

          let hotspotsHTML = '';
          item.hotspots.forEach(hs => {
            hotspotsHTML += `
              <a-sphere 
                class="clickable" 
                position="${hs.pos}" 
                radius="0.04" 
                color="#FFFFFF"
                animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; loop: true; dur: 600"
                onclick="openCard('${hs.title}', '${hs.desc}')">
              </a-sphere>
            `;
          });

          entity.innerHTML = `
            <a-gltf-model src="${item.model}" position="0 0 0" scale="${item.scale}" class="clickable" gesture-handler>
              ${hotspotsHTML}
            </a-gltf-model>
          `;
          container.appendChild(entity);
        });
      });

      function openCard(title, desc) {
        document.getElementById('card-title').innerText = title;
        document.getElementById('card-desc').innerText = desc;
        document.getElementById('info-card').style.display = 'block';
      }
      function closeCard() {
        document.getElementById('info-card').style.display = 'none';
      }
    </script>
  </body>
</html>
