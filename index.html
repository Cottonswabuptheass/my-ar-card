<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>WebAR - 3D Hardware Guide</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="./js/gpu.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; background: transparent; }
    
    #info-card {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 88%; max-width: 400px; background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #ffffff; padding: 16px 20px; border-radius: 16px; z-index: 1000;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: none;
      animation: fadeInUp 0.4s ease-out;
    }
    #info-card h4 { margin: 0 0 6px 0; color: #38bdf8; font-size: 18px; }
    #info-card p { margin: 0; font-size: 13px; color: #e2e8f0; line-height: 1.5; }
    .hint { font-size: 11px; color: #94a3b8; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }

    #scan-guide {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7); color: #fff; padding: 8px 16px;
      border-radius: 20px; font-size: 13px; border: 1px solid rgba(255,255,255,0.2);
      z-index: 1000; pointer-events: none;
    }

    #error-log {
      position: fixed; top: 70px; left: 5%; width: 90%;
      background: rgba(220, 38, 38, 0.85); color: white;
      padding: 10px; border-radius: 8px; font-size: 12px;
      z-index: 9999; display: none; word-break: break-all;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <div id="scan-guide">🔍 ส่องกล้องไปที่รูปภาพเป้าหมาย</div>
  <div id="error-log"></div>

  <div id="info-card">
    <h4 id="card-title">กำลังโหลด...</h4>
    <p id="card-desc">...</p>
    <div class="hint">💡 ใช้นิ้วลากหมุน | ใช้นิ้วถ่างเพื่อซูมเข้า-ออก</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; precision: medium; alpha: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-ambient-light color="#ffffff" intensity="1.5"></a-ambient-light>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="ar-container"></a-entity>
  </a-scene>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const log = document.getElementById('error-log');
      log.style.display = 'block';
      log.innerHTML = '⚠️ เกิดข้อผิดพลาด: ' + msg;
      return false;
    };

    const container = document.getElementById('ar-container');
    let isTracked = false;
    let modelEntityRef = null;

    // สำหรับควบคุมหมุนและซูม
    let isDragging = false;
    let previousTouchPosition = { x: 0, y: 0 };
    let initialPinchDistance = null;
    let initialScale = { x: 0.04, y: 0.04, z: 0.04 }; // ย่อสเกลเริ่มต้นให้พอดีจอ

    function loadARItem(itemData) {
      if (!itemData) return;

      const targetEntity = document.createElement('a-entity');
      targetEntity.setAttribute('mindar-image-target', `targetIndex: ${itemData.targetIndex}`);

      const modelEntity = document.createElement('a-entity');
      modelEntity.setAttribute('gltf-model', itemData.model);
      
      // ตั้งสเกลเริ่มต้นให้ไม่คับจอเกินไป
      const baseScale = itemData.scale ? itemData.scale : '0.04 0.04 0.04';
      modelEntity.setAttribute('scale', baseScale);
      modelEntity.setAttribute('position', itemData.position || '0 0 0');
      modelEntity.setAttribute('rotation', itemData.rotation || '0 0 0');
      
      modelEntityRef = modelEntity;
      targetEntity.appendChild(modelEntity);

      targetEntity.addEventListener("targetFound", () => {
        if (!isTracked) {
          isTracked = true;
          document.getElementById('card-title').innerText = itemData.title || 'ข้อมูลอุปกรณ์';
          document.getElementById('card-desc').innerText = itemData.desc || '';
          document.getElementById('info-card').style.display = 'block';
          document.getElementById('scan-guide').style.display = 'none';

          // ล็อกตำแหน่งโดยไม่ปิดกล้องวิดีโอ (ไม่ทำให้เกิดจอดำ)
          const currentScale = modelEntityRef.getAttribute('scale');
          initialScale = { ...currentScale };
        }
      });

      container.appendChild(targetEntity);
    }

    // คำนวณระยะห่างระหว่าง 2 นิ้วสำหรับซูม
    function getPinchDistance(touches) {
      return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
    }

    // Touch Event Handling (หมุน + ถ่างซูม)
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getPinchDistance(e.touches);
        if (modelEntityRef) {
          const currentScale = modelEntityRef.getAttribute('scale');
          initialScale = { ...currentScale };
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!modelEntityRef) return;

      // 1. หมุนโมเดล (1 นิ้ว)
      if (isDragging && e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - previousTouchPosition.x;
        const deltaY = e.touches[0].clientY - previousTouchPosition.y;

        const currentRotation = modelEntityRef.getAttribute('rotation');
        modelEntityRef.setAttribute('rotation', {
          x: currentRotation.x + deltaY * 0.4,
          y: currentRotation.y + deltaX * 0.4,
          z: currentRotation.z
        });

        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } 
      // 2. ถ่างซูมเข้า-ออก (2 นิ้ว)
      else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = getPinchDistance(e.touches);
        const factor = currentDistance / initialPinchDistance;

        // คำนวณขนาดใหม่ (จำกัดขนาดไม่ให้เล็กหรือใหญ่เกินไป)
        let newScaleX = Math.min(Math.max(initialScale.x * factor, 0.01), 0.15);
        let newScaleY = Math.min(Math.max(initialScale.y * factor, 0.01), 0.15);
        let newScaleZ = Math.min(Math.max(initialScale.z * factor, 0.01), 0.15);

        modelEntityRef.setAttribute('scale', { x: newScaleX, y: newScaleY, z: newScaleZ });
      }
    });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isDragging = false;
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof gpuData !== 'undefined') {
        loadARItem(gpuData);
      } else {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerText = '⚠️ ไม่พบข้อมูลไฟล์ js/gpu.js';
      }
    });
  </script>
</body>
</html>
